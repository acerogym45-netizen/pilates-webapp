<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무료 운동 클래스 신청 — 아세로짐 라마다 대전점</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* ── 이 페이지 전용 추가 스타일 ── */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 24px 0 20px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            color: var(--color-text-on-dark);
            font-size: 1.1rem;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: rgba(255,255,255,.14); }
        .page-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-gold-light);
        }

        /* 일정 카드 */
        .schedule-card {
            background: var(--color-card-primary);
            border: 1px solid rgba(201,168,76,.3);
            border-radius: var(--card-radius);
            padding: 18px 16px;
            margin-bottom: 20px;
        }
        .schedule-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: 8px;
        }
        .schedule-main {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--color-text-on-dark);
            margin-bottom: 6px;
        }
        .schedule-seats {
            font-size: 0.88rem;
            font-weight: 600;
        }
        .schedule-seats.available { color: #6fcf97; }
        .schedule-seats.few       { color: #f2c94c; }
        .schedule-seats.full      { color: #eb5757; }

        /* 폼 */
        .form-section { margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            color: var(--color-text-on-dark);
            font-size: 1rem;
            outline: none;
            transition: border-color .18s;
            -webkit-appearance: none;
        }
        .form-input::placeholder { color: var(--color-text-muted); }
        .form-input:focus { border-color: var(--color-gold); }

        /* 약관 토글 */
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 0;
            border-top: 1px solid rgba(255,255,255,.07);
        }
        .terms-checkbox {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            accent-color: var(--color-gold);
            margin-top: 1px;
            cursor: pointer;
        }
        .terms-text {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            line-height: 1.5;
        }
        .terms-detail {
            display: none;
            margin-top: 8px;
            font-size: 0.78rem;
            color: var(--color-text-muted);
            background: rgba(0,0,0,.2);
            border-radius: 8px;
            padding: 10px 12px;
            line-height: 1.6;
        }
        .terms-toggle-btn {
            background: none;
            border: none;
            color: var(--color-gold);
            font-size: 0.78rem;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            min-height: 56px;
            background: var(--color-gold);
            color: var(--color-navy-d);
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .18s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover  { background: var(--color-gold-light); }
        .submit-btn:disabled {
            background: rgba(255,255,255,.15);
            color: var(--color-text-muted);
            cursor: not-allowed;
        }

        /* 상태 영역 */
        .status-box {
            border-radius: 12px;
            padding: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 16px;
            display: none;
        }
        .status-box.error   { background: rgba(235,87,87,.15);  color: #f8a0a0; border: 1px solid rgba(235,87,87,.3); }
        .status-box.success { background: rgba(111,207,151,.15); color: #a0f0c0; border: 1px solid rgba(111,207,151,.3); }
        .status-box.info    { background: rgba(201,168,76,.12);  color: var(--color-gold-light); border: 1px solid rgba(201,168,76,.25); }
        .status-box.show    { display: block; }

        /* 완료 화면 */
        .done-screen { display: none; text-align: center; padding: 32px 0; }
        .done-screen.show { display: block; }
        .done-icon { font-size: 3.5rem; margin-bottom: 16px; }
        .done-title { font-size: 1.3rem; font-weight: 700; color: var(--color-gold-light); margin-bottom: 10px; }
        .done-desc  { font-size: 0.9rem; color: var(--color-text-muted); line-height: 1.7; margin-bottom: 28px; }
        .back-link  {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            color: var(--color-text-on-dark);
            font-size: 0.9rem;
        }
        .back-link:hover { background: rgba(255,255,255,.08); }

        /* 로딩 스피너 */
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: var(--color-navy-d);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="page-wrap">

    <!-- 헤더 -->
    <div class="page-header">
        <a href="./index.html" class="back-btn" aria-label="뒤로">‹</a>
        <h1 class="page-title">무료 운동 클래스 신청</h1>
    </div>

    <!-- 신청 폼 영역 -->
    <div id="formArea">

        <!-- 다음 일정 카드 -->
        <div class="schedule-card">
            <p class="schedule-label">다음 클래스 일정</p>
            <p class="schedule-main" id="scheduleText">일정을 불러오는 중…</p>
            <p class="schedule-seats" id="scheduleSeats"></p>
        </div>

        <!-- 상태 메시지 박스 -->
        <div class="status-box" id="statusBox"></div>

        <!-- 신청 폼 -->
        <div class="form-section" id="applyForm">
            <div class="form-group">
                <label class="form-label" for="inputName">이름</label>
                <input id="inputName" class="form-input" type="text"
                       placeholder="홍길동" autocomplete="name" maxlength="20">
            </div>
            <div class="form-group">
                <label class="form-label" for="inputPhone">휴대폰 번호</label>
                <input id="inputPhone" class="form-input" type="tel"
                       placeholder="010-0000-0000" autocomplete="tel" maxlength="13">
            </div>

            <!-- 약관 동의 -->
            <div class="terms-row">
                <input type="checkbox" id="termsCheck" class="terms-checkbox">
                <div class="terms-text">
                    <label for="termsCheck">
                        개인정보 수집·이용에 동의합니다 (필수)
                    </label>
                    <button type="button" class="terms-toggle-btn" id="termsToggleBtn">내용 보기</button>
                    <div class="terms-detail" id="termsDetail">
                        수집 항목: 이름, 휴대폰 번호<br>
                        수집 목적: 무료 클래스 신청 및 운영 관리<br>
                        보유 기간: 클래스 종료 후 1개월<br>
                        귀하는 동의를 거부할 수 있으나, 거부 시 신청이 불가합니다.
                    </div>
                </div>
            </div>

            <button type="button" class="submit-btn" id="submitBtn" disabled>
                신청하기
            </button>
        </div>

    </div>
    <!-- / #formArea -->

    <!-- 완료 화면 (신청 성공 후 표시) -->
    <div class="done-screen" id="doneScreen">
        <div class="done-icon">✅</div>
        <p class="done-title">신청 완료!</p>
        <p class="done-desc" id="doneDesc">
            클래스 당일 피트니스 센터로 오시면 됩니다.<br>
            별도 확인 절차 없이 바로 입장하실 수 있습니다.
        </p>
        <a href="./index.html" class="back-link">처음 화면으로</a>
    </div>

</div>
<!-- / .page-wrap -->

<script src="./js/api-client.js"></script>
<script src="./js/quick-class.js"></script>
</body>
</html>
